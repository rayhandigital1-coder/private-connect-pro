
name: Private Connect PRO Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        run: |
          flutter create \
            --project-name private_connect_pro \
            --org com.privateconnect \
            --platforms android .

      - name: Set correct Android package ID
        run: |
          sed -i 's/applicationId = ".*"/applicationId = "com.privateconnect.pro"/' android/app/build.gradle.kts
          sed -i 's/namespace = ".*"/namespace = "com.privateconnect.pro"/' android/app/build.gradle.kts
          sed -i 's/com.privateconnect.private_connect_pro/com.privateconnect.pro/g' android/app/build.gradle.kts

      - name: Add Firebase configuration
        run: |
          mkdir -p android/app
          cp google-services.json android/app/google-services.json

      - name: Configure Google Services plugin
        run: |
          sed -i '/plugins {/a\    id "com.google.gms.google-services" version "4.4.2" apply false' android/settings.gradle

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Private-Connect-PRO-APK
          path: build/app/outputs/flutter-apk/app-release.apk
